<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      x-data="{ sidebarOpen: false, darkMode: JSON.parse(localStorage.getItem('darkMode') || 'false') }"
      x-init="$watch('darkMode', v => localStorage.setItem('darkMode', JSON.stringify(v)))"
      :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8" />
  <title>Mantenimiento · ECOSALUD</title>
  <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased dark:bg-gray-950 dark:text-gray-100">
<div class="flex">
  <aside th:replace="~{fragments/layout :: sidebar(active='mantenimiento')}"></aside>
  <div th:replace="~{fragments/layout :: overlay}"></div>

  <div class="flex min-h-screen w-full flex-1 flex-col">
    <header th:replace="~{fragments/layout :: topbar(pageTitle='Mantenimiento', pageSubtitle='Mantenimiento preventivo y correctivo de equipos')}"></header>

    <main class="flex-1 p-4 sm:p-6">
      <nav class="mb-4 flex items-center gap-1.5 text-xs text-gray-400">
        <a th:href="@{/}" class="hover:text-brand-500">Inicio</a>
        <i data-lucide="chevron-right" class="h-3 w-3"></i>
        <span class="text-gray-500 dark:text-gray-300">Mantenimiento / Mantenimiento</span>
      </nav>


      <div x-data="{ modalMant:false }">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
          <select class="form-select !w-auto"><option>Todos los tipos</option><option>Preventivo</option><option>Correctivo</option></select>
          <button @click="modalMant=true" class="btn btn-primary"><i data-lucide="calendar-plus" class="h-4 w-4"></i><span>Programar mantenimiento</span></button>
        </div>
        <div class="card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 dark:bg-gray-800/50">
                <tr><th class="table-th">Equipo</th><th class="table-th">Tipo</th><th class="table-th">Fecha</th><th class="table-th">Responsable</th><th class="table-th">Estado</th><th class="table-th">Acciones</th></tr>
              </thead>
              <tbody>
              <tr class="table-row border-t border-gray-100 dark:border-gray-800">
                <td class="table-td font-medium">ECO-003</td>
                <td class="table-td">Preventivo</td>
                <td class="table-td">26/09 sep</td>
                <td class="table-td">Tec. Jorge Ruiz</td>
                <td class="table-td"><span class="badge bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">Programado</span></td>
                <td class="table-td">
                  <div class="flex items-center gap-1.5">
                    <a th:href="@{/historial-equipo}" class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Historial"><i data-lucide="history" class="h-4 w-4"></i></a>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-green-50 hover:text-green-600" title="Cambiar estado"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
                  </div>
                </td>
              </tr>
              <tr class="table-row border-t border-gray-100 dark:border-gray-800">
                <td class="table-td font-medium">ECO-004</td>
                <td class="table-td">Correctivo</td>
                <td class="table-td">24/09 sep</td>
                <td class="table-td">Tec. Jorge Ruiz</td>
                <td class="table-td"><span class="badge bg-orange-50 text-orange-600 dark:bg-orange-500/10 dark:text-orange-400">En proceso</span></td>
                <td class="table-td">
                  <div class="flex items-center gap-1.5">
                    <a th:href="@{/historial-equipo}" class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Historial"><i data-lucide="history" class="h-4 w-4"></i></a>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-green-50 hover:text-green-600" title="Cambiar estado"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
                  </div>
                </td>
              </tr>
              <tr class="table-row border-t border-gray-100 dark:border-gray-800">
                <td class="table-td font-medium">ECO-002</td>
                <td class="table-td">Preventivo</td>
                <td class="table-td">10/09 sep</td>
                <td class="table-td">Tec. Ines Vargas</td>
                <td class="table-td"><span class="badge bg-green-50 text-green-600 dark:bg-green-500/10 dark:text-green-400">Completado</span></td>
                <td class="table-td">
                  <div class="flex items-center gap-1.5">
                    <a th:href="@{/historial-equipo}" class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Historial"><i data-lucide="history" class="h-4 w-4"></i></a>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-green-50 hover:text-green-600" title="Cambiar estado"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
                  </div>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div x-show="modalMant" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 p-4" @keydown.escape.window="modalMant=false">
          <div @click.outside="modalMant=false" x-transition class="w-full max-w-md rounded-2xl bg-white p-6 dark:bg-gray-900">
            <div class="mb-4 flex items-center justify-between">
              <h3 class="text-base font-semibold text-gray-800 dark:text-white">Programar mantenimiento</h3>
              <button @click="modalMant=false" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>
            <div class="space-y-4">
              <div><label class="form-label">Equipo</label><select class="form-select"><option>ECO-001</option><option>ECO-002</option><option>ECO-003</option><option>ECO-004</option></select></div>
              <div><label class="form-label">Tipo</label><select class="form-select"><option>Preventivo</option><option>Correctivo</option></select></div>
              <div class="grid grid-cols-2 gap-4">
                <div><label class="form-label">Fecha</label><input type="date" class="form-input" /></div>
                <div><label class="form-label">Responsable</label><input class="form-input" placeholder="Tec. Jorge Ruiz" /></div>
              </div>
              <div><label class="form-label">Observaciones</label><textarea class="form-textarea" rows="2"></textarea></div>
              <div><label class="form-label">Proximo mantenimiento</label><input type="date" class="form-input" /></div>
              <div class="flex justify-end gap-2 pt-2">
                <button @click="modalMant=false" class="btn btn-outline">Cancelar</button>
                <button class="btn btn-primary">Guardar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
