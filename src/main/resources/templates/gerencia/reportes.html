<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      x-data="{ sidebarOpen: false, darkMode: JSON.parse(localStorage.getItem('darkMode') || 'false') }"
      x-init="$watch('darkMode', v => localStorage.setItem('darkMode', JSON.stringify(v)))"
      :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8" />
  <title>Reportes · ECOSALUD</title>
  <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased dark:bg-gray-950 dark:text-gray-100">
<div class="flex">
  <aside th:replace="~{fragments/layout :: sidebar(active='reportes')}"></aside>
  <div th:replace="~{fragments/layout :: overlay}"></div>

  <div class="flex min-h-screen w-full flex-1 flex-col">
    <header th:replace="~{fragments/layout :: topbar(pageTitle='Reportes', pageSubtitle='Reportes operativos consolidados y filtrables')}"></header>

    <main class="flex-1 p-4 sm:p-6">
      <nav class="mb-4 flex items-center gap-1.5 text-xs text-gray-400">
        <a th:href="@{/}" class="hover:text-brand-500">Inicio</a>
        <i data-lucide="chevron-right" class="h-3 w-3"></i>
        <span class="text-gray-500 dark:text-gray-300">Gerencia / Reportes</span>
      </nav>


      <div class="grid grid-cols-1 gap-5 lg:grid-cols-3">
        <div class="card p-5 lg:col-span-1">
          <h3 class="mb-4 text-sm font-semibold text-gray-700 dark:text-gray-200">Generar reporte</h3>
          <div class="space-y-4">
            <div><label class="form-label">Tipo de reporte</label><select class="form-select"><option>Citas</option><option>Atenciones</option><option>Servicios</option><option>Especialistas</option><option>Equipos</option><option>Informes</option><option>Inventario</option><option>Inasistencias</option></select></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="form-label">Desde</label><input type="date" class="form-input" /></div>
              <div><label class="form-label">Hasta</label><input type="date" class="form-input" /></div>
            </div>
            <div><label class="form-label">Formato</label>
              <div class="flex gap-2">
                <label class="flex items-center gap-1.5 text-xs text-gray-600 dark:text-gray-300"><input type="radio" name="fmt" checked /> PDF</label>
                <label class="flex items-center gap-1.5 text-xs text-gray-600 dark:text-gray-300"><input type="radio" name="fmt" /> Excel</label>
              </div>
            </div>
            <div class="flex gap-2 pt-2">
              <button class="btn btn-primary flex-1"><i data-lucide="bar-chart-3" class="h-4 w-4"></i>Generar</button>
              <button class="btn btn-outline flex-1"><i data-lucide="download" class="h-4 w-4"></i>Exportar</button>
            </div>
          </div>
        </div>

        <div class="card p-5 lg:col-span-2">
          <h3 class="mb-4 text-sm font-semibold text-gray-700 dark:text-gray-200">Reportes recientes</h3>
          <div class="space-y-3">
          <div class="flex items-center justify-between rounded-lg border border-gray-100 p-3 dark:border-gray-800">
            <div class="flex items-center gap-3">
              <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-500 dark:bg-gray-800"><i data-lucide="file-text" class="h-4 w-4"></i></div>
              <div><p class="text-sm font-medium text-gray-700 dark:text-gray-200">Reporte de atenciones</p><p class="text-xs text-gray-400">01/09 - 30/09 &middot; PDF</p></div>
            </div>
            <button class="btn btn-outline !py-1.5 !px-3 !text-xs"><i data-lucide="download" class="h-3.5 w-3.5"></i>Descargar</button>
          </div>
          <div class="flex items-center justify-between rounded-lg border border-gray-100 p-3 dark:border-gray-800">
            <div class="flex items-center gap-3">
              <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-500 dark:bg-gray-800"><i data-lucide="file-text" class="h-4 w-4"></i></div>
              <div><p class="text-sm font-medium text-gray-700 dark:text-gray-200">Reporte de inventario</p><p class="text-xs text-gray-400">01/09 - 30/09 &middot; Excel</p></div>
            </div>
            <button class="btn btn-outline !py-1.5 !px-3 !text-xs"><i data-lucide="download" class="h-3.5 w-3.5"></i>Descargar</button>
          </div>
          <div class="flex items-center justify-between rounded-lg border border-gray-100 p-3 dark:border-gray-800">
            <div class="flex items-center gap-3">
              <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-500 dark:bg-gray-800"><i data-lucide="file-text" class="h-4 w-4"></i></div>
              <div><p class="text-sm font-medium text-gray-700 dark:text-gray-200">Reporte de inasistencias</p><p class="text-xs text-gray-400">01/08 - 31/08 &middot; PDF</p></div>
            </div>
            <button class="btn btn-outline !py-1.5 !px-3 !text-xs"><i data-lucide="download" class="h-3.5 w-3.5"></i>Descargar</button>
          </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
