<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      x-data="{ sidebarOpen: false, darkMode: JSON.parse(localStorage.getItem('darkMode') || 'false') }"
      x-init="$watch('darkMode', v => localStorage.setItem('darkMode', JSON.stringify(v)))"
      :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8" />
  <title>Informes · ECOSALUD</title>
  <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased dark:bg-gray-950 dark:text-gray-100">
<div class="flex">
  <aside th:replace="~{fragments/layout :: sidebar(active='informes')}"></aside>
  <div th:replace="~{fragments/layout :: overlay}"></div>

  <div class="flex min-h-screen w-full flex-1 flex-col">
    <header th:replace="~{fragments/layout :: topbar(pageTitle='Informes', pageSubtitle='Elaboracion, validacion y entrega de resultados')}"></header>

    <main class="flex-1 p-4 sm:p-6">
      <nav class="mb-4 flex items-center gap-1.5 text-xs text-gray-400">
        <a th:href="@{/}" class="hover:text-brand-500">Inicio</a>
        <i data-lucide="chevron-right" class="h-3 w-3"></i>
        <span class="text-gray-500 dark:text-gray-300">Operaciones / Informes</span>
      </nav>


      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex gap-2">
          <select class="form-select !w-auto"><option>Todos los estados</option><option>Borrador</option><option>En revision</option><option>Finalizado</option><option>Entregado</option></select>
        </div>
        <button class="btn btn-primary"><i data-lucide="file-plus" class="h-4 w-4"></i><span>Elaborar informe</span></button>
      </div>
      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-800/50">
              <tr>
                <th class="table-th">Informe</th>
                <th class="table-th">Paciente</th>
                <th class="table-th">Atencion</th>
                <th class="table-th">Especialista</th>
                <th class="table-th">Estado</th>
                <th class="table-th">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr class="table-row border-t border-gray-100 dark:border-gray-800">
                <td class="table-td font-medium">INF-001</td>
                <td class="table-td">Ana Perez</td>
                <td class="table-td">AT-001</td>
                <td class="table-td">Dr. X</td>
                <td class="table-td"><span class="badge bg-yellow-50 text-yellow-700 dark:bg-yellow-500/10 dark:text-yellow-400">En revision</span></td>
                <td class="table-td">
                  <div class="flex items-center gap-1.5">
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Editar"><i data-lucide="pencil" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Revisar"><i data-lucide="eye" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-green-50 hover:text-green-600" title="Validar / finalizar"><i data-lucide="check-check" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Entregar"><i data-lucide="send" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Descargar"><i data-lucide="download" class="h-4 w-4"></i></button>
                  </div>
                </td>
              </tr>
              <tr class="table-row border-t border-gray-100 dark:border-gray-800">
                <td class="table-td font-medium">INF-002</td>
                <td class="table-td">Luis Ramos</td>
                <td class="table-td">AT-002</td>
                <td class="table-td">Dra. Y</td>
                <td class="table-td"><span class="badge bg-green-50 text-green-600 dark:bg-green-500/10 dark:text-green-400">Finalizado</span></td>
                <td class="table-td">
                  <div class="flex items-center gap-1.5">
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Editar"><i data-lucide="pencil" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Revisar"><i data-lucide="eye" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-green-50 hover:text-green-600" title="Validar / finalizar"><i data-lucide="check-check" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Entregar"><i data-lucide="send" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Descargar"><i data-lucide="download" class="h-4 w-4"></i></button>
                  </div>
                </td>
              </tr>
              <tr class="table-row border-t border-gray-100 dark:border-gray-800">
                <td class="table-td font-medium">INF-003</td>
                <td class="table-td">Maria Lopez</td>
                <td class="table-td">AT-003</td>
                <td class="table-td">Dr. X</td>
                <td class="table-td"><span class="badge bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-300">Borrador</span></td>
                <td class="table-td">
                  <div class="flex items-center gap-1.5">
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Editar"><i data-lucide="pencil" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Revisar"><i data-lucide="eye" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-green-50 hover:text-green-600" title="Validar / finalizar"><i data-lucide="check-check" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Entregar"><i data-lucide="send" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Descargar"><i data-lucide="download" class="h-4 w-4"></i></button>
                  </div>
                </td>
              </tr>
              <tr class="table-row border-t border-gray-100 dark:border-gray-800">
                <td class="table-td font-medium">INF-004</td>
                <td class="table-td">Jose Mendoza</td>
                <td class="table-td">AT-004</td>
                <td class="table-td">Dra. Y</td>
                <td class="table-td"><span class="badge bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">Entregado</span></td>
                <td class="table-td">
                  <div class="flex items-center gap-1.5">
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Editar"><i data-lucide="pencil" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Revisar"><i data-lucide="eye" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-green-50 hover:text-green-600" title="Validar / finalizar"><i data-lucide="check-check" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Entregar"><i data-lucide="send" class="h-4 w-4"></i></button>
                    <button class="rounded-lg p-1.5 text-gray-400 hover:bg-brand-50 hover:text-brand-500" title="Descargar"><i data-lucide="download" class="h-4 w-4"></i></button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
